<!doctype html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="/style.css"></head><body><div id="root"></div><script>
// Verification driver only: original callbacks/formulas are untouched. Media
// stays fixed while RAF converges so this isolates TARGET/raster, not smoothing.
window.testNow=0;let serial=0;window.testRafs=new Map();
Object.defineProperty(performance,'now',{value:()=>window.testNow});
window.requestAnimationFrame=cb=>{const id=++serial;window.testRafs.set(id,cb);return id};
window.cancelAnimationFrame=id=>window.testRafs.delete(id);
window.advanceSourceFrame=()=>{window.testNow+=1000/60;const cbs=[...window.testRafs.values()];window.testRafs.clear();for(const cb of cbs)cb(window.testNow)};
</script><script type="module" src="/cadenza-mounted.tsx"></script></body></html>
